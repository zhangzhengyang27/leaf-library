<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 裸 squircle 底板：make-icons.mjs 接用户底稿时，把抠好底的叶子合成到这上面 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BCD95"/>
      <stop offset="0.55" stop-color="#4CB573"/>
      <stop offset="1" stop-color="#2B8F51"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="#1E6B3B" stroke-opacity="0.16" stroke-width="3"/>
</svg>
