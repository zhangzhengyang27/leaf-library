<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>颜色转换器</title><style>
body{margin:0;padding:8px;font:12px/1.6 -apple-system,'PingFang SC',sans-serif;color:#4b5563;background:#fff}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.top input[type=color]{width:44px;height:32px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;padding:2px;cursor:pointer}
.big{font-size:13px;color:#111827;font-weight:600;user-select:text}
.fmt{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed #e5e7eb}
.fmt:last-of-type{border-bottom:none}
.fmt .k{color:#9ca3af;width:34px;flex-shrink:0}
.fmt input{flex:1;min-width:0;font:12px ui-monospace,Menlo,monospace;color:#111827;border:1px solid #e5e7eb;border-radius:5px;padding:3px 6px;outline:none;background:#fff}
.fmt input:focus{border-color:#93c5fd}
.copy{border:1px solid #e5e7eb;border-radius:5px;background:#fff;color:#4b5563;font-size:11px;height:22px;padding:0 8px;cursor:pointer;flex-shrink:0}
.copy:hover{background:#f3f4f6}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.quick button:hover{box-shadow:0 0 0 2px #93c5fd}
.sec{margin:8px 0 4px;color:#9ca3af;font-size:11px}
.hint{margin-top:6px;color:#16a34a;font-size:11px;min-height:16px}
</style></head>
<body>
<div class="top">
  <input type="color" id="picker" value="#3b82f6" title="取色器" />
  <span class="big" id="big">#3B82F6</span>
</div>
<div class="fmt"><span class="k">HEX</span><input id="hex" spellcheck="false" /><button type="button" class="copy" data-fmt="hex">复制</button></div>
<div class="fmt"><span class="k">RGB</span><input id="rgb" spellcheck="false" /><button type="button" class="copy" data-fmt="rgb">复制</button></div>
<div class="fmt"><span class="k">HSL</span><input id="hsl" spellcheck="false" /><button type="button" class="copy" data-fmt="hsl">复制</button></div>
<div class="sec">常用色（点击套用）</div>
<div id="quick" class="quick"></div>
<div id="hint" class="hint"></div>
<script>
/** 三个输入框双向同步：format='hex'|'rgb'|'hsl' 表示本次改动的来源栏 */
var syncing=false;
var COLORS=[
  ['#ef4444','红'],['#f97316','橙'],['#facc15','黄'],['#22c55e','绿'],
  ['#14b8a6','青'],['#3b82f6','蓝'],['#8b5cf6','紫'],['#ec4899','粉'],
  ['#111827','黑'],['#6b7280','灰'],['#e5e7eb','浅灰'],['#ffffff','白']
];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function hexOf(r,g,b){return '#'+[r,g,b].map(function(v){var s=Math.round(v).toString(16);return s.length<2?'0'+s:s}).join('').toUpperCase()}
function parseHex(s){
  var m=/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(s.trim());
  if(!m)return null;
  var h=m[1];
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
}
function parseRgb(s){
  var m=/(\d+)\s*[, ]\s*(\d+)\s*[, ]\s*(\d+)/.exec(s);
  if(!m)return null;
  return {r:clamp(+m[1],0,255),g:clamp(+m[2],0,255),b:clamp(+m[3],0,255)};
}
function parseHsl(s){
  var m=/(\d+(?:\.\d+)?)\s*[, ]\s*(\d+(?:\.\d+)?)%?\s*[, ]\s*(\d+(?:\.\d+)?)%?/.exec(s);
  if(!m)return null;
  return hslToRgb(+m[1]%360,clamp(+m[2],0,100)/100,clamp(+m[3],0,100)/100);
}
function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  var max=Math.max(r,g,b),min=Math.min(r,g,b),h=0,s=0,l=(max+min)/2;
  if(max!==min){
    var d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    if(max===r)h=((g-b)/d+(g<b?6:0));
    else if(max===g)h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  return {h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};
}
function hslToRgb(h,s,l){
  h/=360;
  if(s===0){var v=Math.round(l*255);return {r:v,g:v,b:v}}
  var q=l<0.5?l*(1+s):l+s-l*s,p=2*l-q;
  function t(c){
    if(c<0)c+=1;if(c>1)c-=1;
    if(c<1/6)return p+(q-p)*6*c;
    if(c<1/2)return q;
    if(c<2/3)return p+(q-p)*(2/3-c)*6;
    return p;
  }
  return {r:Math.round(t(h+1/3)*255),g:Math.round(t(h)*255),b:Math.round(t(h-1/3)*255)};
}
function fmts(c){
  var hsl=rgbToHsl(c.r,c.g,c.b);
  return {
    hex:hexOf(c.r,c.g,c.b),
    rgb:'rgb('+c.r+', '+c.g+', '+c.b+')',
    hsl:'hsl('+hsl.h+', '+hsl.s+'%, '+hsl.l+'%)'
  };
}
/** 统一入口：以 {r,g,b} 为真值刷新三栏与取色器；src 指示不用回写的来源栏 */
function apply(c,src){
  syncing=true;
  var f=fmts(c);
  if(src!=='hex')document.getElementById('hex').value=f.hex;
  if(src!=='rgb')document.getElementById('rgb').value=f.rgb;
  if(src!=='hsl')document.getElementById('hsl').value=f.hsl;
  document.getElementById('picker').value=f.hex.toLowerCase();
  document.getElementById('big').textContent=f.hex;
  document.getElementById('big').style.color=f.hex;
  syncing=false;
  current=c;
}
function copyText(text){
  function done(){setHint('已复制 '+text)}
  function fallback(){
    try{
      var ta=document.createElement('textarea');ta.value=text;
      ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      var ok=document.execCommand('copy');
      document.body.removeChild(ta);
      setHint(ok?'已复制 '+text:'复制失败，请手动选择文本');
    }catch(err){setHint('复制失败，请手动选择文本')}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,fallback)
  }else fallback();
}
function setHint(t){document.getElementById('hint').textContent=t}
var current={r:59,g:130,b:246};
// 三栏互转：改任一输入，解析成功即同步其余两栏
document.getElementById('hex').addEventListener('input',function(){if(syncing)return;var c=parseHex(this.value);if(c)apply(c,'hex')});
document.getElementById('rgb').addEventListener('input',function(){if(syncing)return;var c=parseRgb(this.value);if(c)apply(c,'rgb')});
document.getElementById('hsl').addEventListener('input',function(){if(syncing)return;var c=parseHsl(this.value);if(c)apply(c,'hsl')});
document.getElementById('picker').addEventListener('input',function(){var c=parseHex(this.value);if(c)apply(c)});
// 复制按钮：点击复制对应格式当前值
document.querySelectorAll('.copy').forEach(function(btn){
  btn.addEventListener('click',function(){copyText(document.getElementById(btn.dataset.fmt).value)});
});
// 常用色快捷块
var quick=document.getElementById('quick');
quick.innerHTML=COLORS.map(function(c){
  return '<button type="button" style="background:'+c[0]+'" title="'+c[1]+' '+c[0]+'" data-c="'+c[0]+'"></button>'}).join('');
quick.addEventListener('click',function(ev){
  var btn=ev.target.closest('button');if(!btn)return;
  var c=parseHex(btn.dataset.c);if(c)apply(c);
});
apply(current);
// window 类插件不依赖素材数据；协议要求保持监听以兼容统一注入
window.addEventListener('message',function(e){var m=e.data;if(!(m&&m.type==='leaf:data'))return;void m.payload})
parent.postMessage({type:'leaf:ready'},'*')
</script></body></html>
