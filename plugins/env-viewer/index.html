<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>环境变量查看器</title><style>
body{margin:0;padding:8px;font:12px/1.6 -apple-system,'PingFang SC',sans-serif;color:#4b5563;background:#fff}
.empty{color:#9ca3af;text-align:center;padding:16px 0}
.meta{margin-bottom:6px;color:#9ca3af;font-size:11px}
.chip{display:inline-block;padding:0 7px;margin:0 4px 4px 0;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;font-size:10px;color:#374151;line-height:1.8}
.chip b{color:#111827;font-weight:600}
.chip.warn{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.chip.warn b{color:#b91c1c}
.wrap{display:flex;gap:8px;align-items:stretch}
.main{flex:1;min-width:0}
.list{overflow:auto;max-height:300px;border:1px solid #f3f4f6;border-radius:6px}
.vrow{display:flex;gap:6px;align-items:baseline;padding:3px 6px;border-bottom:1px dashed #f3f4f6;font-size:11px}
.vrow:last-child{border-bottom:none}
.vrow .k{flex-shrink:0;max-width:45%;font-family:ui-monospace,Menlo,monospace;color:#111827;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text}
.vrow .v{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:text}
.vrow .v.mask{color:#b91c1c}
.badge{display:inline-block;padding:0 5px;border-radius:4px;font-size:9px;line-height:1.7;flex-shrink:0}
.b-sens{background:#fef2f2;color:#b91c1c}
.b-dup{background:#fffbeb;color:#b45309}
.sidebar{flex-shrink:0;width:110px;overflow:auto;max-height:300px;border:1px solid #f3f4f6;border-radius:6px;padding:4px 6px;background:#f9fafb}
.sidebar .t{font-size:10px;color:#9ca3af;margin-bottom:3px}
.sidebar .c{font-size:10px;color:#6b7280;line-height:1.5;word-break:break-all;border-bottom:1px dashed #e5e7eb;padding:2px 0}
.sidebar .c:last-child{border-bottom:none}
.dupwarn{margin-top:6px;padding:4px 8px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;color:#92400e;font-size:11px;line-height:1.7;user-select:text}
.err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:8px 10px;user-select:text;white-space:pre-wrap;word-break:break-all}
pre{margin:8px 0 0;padding:8px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;overflow:auto;max-height:260px;font:11px/1.5 ui-monospace,Menlo,monospace;color:#111827;white-space:pre;user-select:text}
</style></head>
<body><div id="app" class="empty">等待文件内容…</div>
<script>
function escapeHtml(v){return String(v===null||v===undefined?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

/** 敏感 KEY：含 SECRET/KEY/TOKEN/PASSWORD/CREDENTIAL（不区分大小写） */
var SENSITIVE=/SECRET|KEY|TOKEN|PASSWORD|CREDENTIAL/i

/** 打码：值显示前 2 后 1 字符 + ***（过短的值整体打码） */
function mask(v){
  if(v.length<4)return '***'
  return v.slice(0,2)+'***'+v.slice(-1)
}

window.addEventListener('message',function(e){var m=e.data;if(!(m&&m.type==='leaf:data'))return;var p=m.payload
 try{
  var app=document.getElementById('app')
  if(!p||typeof p.content!=='string'){app.textContent='未选中文件或文件内容为空';return}
  var lines=p.content.replace(/\r\n/g,'\n').split('\n')
  var vars=[],comments=[],other=[]
  for(var i=0;i<lines.length;i++){
    var t=lines[i].trim()
    if(!t)continue
    if(t.charAt(0)==='#'){comments.push({line:i+1,text:t});continue}
    var m2=/^(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$/.exec(t)
    if(m2)vars.push({key:m2[1],value:m2[2],line:i+1})
    else other.push({line:i+1,text:t})
  }
  // 重复 KEY 检测：后者覆盖前者（.env 语义里最后一次出现生效）
  var seen={},dups={}
  for(i=0;i<vars.length;i++){
    var k=vars[i].key
    if(seen[k]!==undefined){dups[k]=(dups[k]||1)+1;vars[i].dup=true}
    else seen[k]=true
  }
  var nSens=0
  for(i=0;i<vars.length;i++)if(SENSITIVE.test(vars[i].key))nSens++
  var dupKeys=Object.keys(dups)
  var html='<div class="meta">'+escapeHtml(p.fileName||'')+' · 变量 '+vars.length+' · 注释 '+comments.length+' 行 · 总行 '+lines.length+'</div>'
  html+='<span class="chip">变量 <b>'+vars.length+'</b></span>'+
    '<span class="chip">敏感 <b>'+nSens+'</b></span>'+
    '<span class="chip'+(dupKeys.length?' warn':'')+'">重复 KEY <b>'+dupKeys.length+'</b></span>'+
    (other.length?'<span class="chip warn">未识别行 <b>'+other.length+'</b></span>':'')
  html+='<div class="wrap"><div class="main"><div class="list">'
  if(vars.length){
    for(i=0;i<vars.length;i++){
      var v=vars[i],sens=SENSITIVE.test(v.key)
      html+='<div class="vrow"><span class="k" title="'+escapeHtml(v.key)+'">'+escapeHtml(v.key)+'</span>'+
        '<span class="v'+(sens?' mask':'')+'"'+(sens?'':' title="'+escapeHtml(v.value)+'"')+'>'+escapeHtml(sens?mask(v.value):v.value)+'</span>'+
        (sens?'<span class="badge b-sens">敏感</span>':'')+
        (v.dup?'<span class="badge b-dup">重复</span>':'')+'</div>'
    }
  }else html+='<div style="color:#9ca3af;font-size:11px;padding:6px">未解析到 KEY=VALUE 变量</div>'
  html+='</div>'
  if(dupKeys.length){
    html+='<div class="dupwarn">重复 KEY（后者覆盖前者，仅最后一次出现生效）：'+
      dupKeys.map(function(dk){return escapeHtml(dk)+' ×'+(dups[dk]+1)+'（生效于第 '+
        (function(){var last=1;for(var j=0;j<vars.length;j++)if(vars[j].key===dk)last=vars[j].line;return last})()+' 行）'}).join('；')+'</div>'
  }
  if(other.length){
    html+='<div class="dupwarn" style="background:#f9fafb;border-color:#e5e7eb;color:#9ca3af">有 '+other.length+
      ' 行不符合 KEY=VALUE 形态（第 '+other.slice(0,8).map(function(o){return o.line}).join('、')+(other.length>8?' 等':'')+' 行），未计入变量表</div>'
  }
  html+='</div>'
  // 注释侧栏
  if(comments.length){
    html+='<div class="sidebar"><div class="t">注释 ×'+comments.length+'</div>'
    for(i=0;i<comments.length;i++)html+='<div class="c" title="第 '+comments[i].line+' 行">'+escapeHtml(comments[i].text)+'</div>'
    html+='</div>'
  }
  html+='</div>'
  app.className=''
  app.innerHTML=html
 }catch(err){
  // 兜底：原文展示 + 错误提示，不能白屏
  var app2=document.getElementById('app');app2.className=''
  app2.innerHTML='<div class="err">解析失败：'+escapeHtml(String((err&&err.message)||err))+'</div>'+
   (p&&typeof p.content==='string'?'<pre>'+escapeHtml(p.content)+'</pre>':'')
 }
})
parent.postMessage({type:'leaf:ready'},'*')
</script></body></html>
