<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        max-width: 520px;
        margin: 40px auto;
        padding: 0 20px;
        font: 13px/1.7 -apple-system, 'PingFang SC', sans-serif;
        color: #1f2937;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        margin: 14px 0 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        background: #e5e7eb;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
      }
      #status {
        margin-top: 12px;
        color: #6b7280;
      }
      .hint {
        color: #6b7280;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Leaf Clipper 设置</h1>
    <p class="hint">
      打开 Leaf → 设置 → 剪藏，复制「服务地址（含端口）」与「Token」粘贴到下面。
    </p>
    <label for="baseUrl">Leaf 服务地址</label>
    <input id="baseUrl" type="text" placeholder="http://127.0.0.1:54321" />
    <label for="token">Token</label>
    <input id="token" type="text" placeholder="Leaf 设置页生成的访问令牌" />
    <div class="row">
      <button id="save" class="primary" type="button">保存</button>
      <button id="test" type="button">测试连接</button>
    </div>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
