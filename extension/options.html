<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 420px; margin: 24px auto; font: 14px/1.6 system-ui, sans-serif; color: #1f2937; }
    h2 { font-size: 16px; }
    label { display: block; margin-top: 12px; font-weight: 500; }
    input { width: 100%; padding: 7px 9px; margin-top: 4px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
    button { margin-top: 14px; padding: 8px 14px; border: 0; border-radius: 6px; background: #10b981; color: #fff; cursor: pointer; }
    .hint { margin-top: 14px; padding: 10px 12px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <h2>Leaf Clip 设置</h2>
  <label>端口
    <input id="port" type="number" placeholder="41595" />
  </label>
  <label>Token
    <input id="token" type="text" placeholder="来自 Leaf 的 clip-server.json" />
  </label>
  <button id="save">保存</button>
  <p id="msg"></p>
  <div class="hint">
    打开 Leaf 应用 → 设置 → 素材库，即可看到「浏览器剪藏」的端口与 Token。<br />
    Token 是访问凭据，请勿泄露给不受信任的人。
  </div>
  <script src="options.js"></script>
</body>
</html>
