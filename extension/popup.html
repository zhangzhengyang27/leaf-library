<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; margin: 0; font: 13px/1.5 system-ui, sans-serif; color: #1f2937; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #10b981; color: #fff; }
    header h1 { font-size: 14px; margin: 0; }
    #status { font-size: 11px; opacity: 0.9; }
    #bar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #e5e7eb; }
    button { flex: 1; padding: 7px 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
    button.primary { background: #10b981; border-color: #10b981; color: #fff; }
    button:disabled { opacity: 0.5; cursor: default; }
    #list { max-height: 380px; overflow-y: auto; padding: 6px 12px 12px; }
    label.item { display: flex; gap: 8px; align-items: center; padding: 4px 0; cursor: pointer; }
    label.item img { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; border: 1px solid #e5e7eb; background: #f3f4f6; }
    label.item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: #6b7280; flex: 1; }
    #empty { padding: 24px 12px; text-align: center; color: #9ca3af; font-size: 12px; }
    .ok { color: #059669; }
    .fail { color: #dc2626; }
  </style>
</head>
<body>
  <header>
    <h1>🍃 Leaf Clip</h1>
    <span id="status">检测中…</span>
  </header>
  <div id="bar">
    <button id="select-all">全选</button>
    <button id="capture">截取可见区域</button>
    <button id="save" class="primary">保存所选</button>
  </div>
  <div id="list"><div id="empty">正在收集本页图片…</div></div>
  <script src="popup.js"></script>
</body>
</html>
